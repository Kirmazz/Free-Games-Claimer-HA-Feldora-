name: Bump feldorn

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bump-feldorn
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Bump si nouvelle version feldorn
        run: |
          set -euo pipefail
          DIR="free-games-claimer-feldorn-fork"
          CONFIG="$DIR/config.yaml"

          # feldorn ne publie pas de "releases" (404) -> on prend le plus haut tag semver
          TAG=$(gh api "repos/feldorn/free-games-claimer/tags?per_page=100" --jq '.[].name' \
                | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          VERSION="${TAG#v}"
          echo "Amont  : tag=$TAG  version=$VERSION"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version amont invalide, on arrete."; exit 1
          fi

          CURRENT=$(grep -E '^version:' "$CONFIG" \
                    | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          echo "Add-on : version=$CURRENT  ($CONFIG)"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Deja a jour."; exit 0
          fi

          # Conserve le préfixe (v ou non) déjà présent sur le tag image du Dockerfile
          CURTAG=$(grep -oE 'free-games-claimer:[^[:space:]"]+' "$DIR/Dockerfile" | sed 's/.*://' || true)
          PREFIX=""; case "$CURTAG" in v*) PREFIX="v";; esac
          NEWTAG="${PREFIX}${VERSION}"

          sed -i -E "s/^version:.*/version: \"${VERSION}\"/" "$CONFIG"
          sed -i -E "s#(free-games-claimer:)[^[:space:]\"]+#\1${NEWTAG}#" "$DIR/Dockerfile"
          echo "Bump $CURRENT -> $VERSION (image: $NEWTAG)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump feldorn $CURRENT -> $VERSION"
          git push
