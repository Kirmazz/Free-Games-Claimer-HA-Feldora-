name: Bump feldorn
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Bump si nouvelle release feldorn
        run: |
          set -euo pipefail

          TAG=$(gh api repos/feldorn/free-games-claimer/releases/latest --jq .tag_name 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "Pas de release 'latest' -> repli sur le dernier tag"
            TAG=$(gh api "repos/feldorn/free-games-claimer/tags?per_page=1" --jq '.[0].name')
          fi
          VERSION="${TAG#v}"
          echo "Amont  : tag=$TAG  version=$VERSION"

          CONFIG=$(find . -mindepth 2 -name config.yaml -print -quit)
          DIR=$(dirname "$CONFIG")
          CURRENT=$(grep -E '^version:' "$CONFIG" | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          echo "Add-on : version=$CURRENT  ($CONFIG)"

          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Deja a jour."
            exit 0
          fi

          CURTAG=$(grep -oE 'free-games-claimer:[^[:space:]"]+' "$DIR/Dockerfile" | sed 's/.*://' || true)
          PREFIX=""; case "$CURTAG" in v*) PREFIX="v";; esac
          NEWTAG="${PREFIX}${VERSION}"
          sed -i -E "s/^version:.*/version: \"${VERSION}\"/" "$CONFIG"
          sed -i -E "s#(free-games-claimer:)[^[:space:]\"]+#\1${NEWTAG}#" "$DIR/Dockerfile"
          echo "Bump $CURRENT -> $VERSION (image: $NEWTAG)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump feldorn $CURRENT -> $VERSION"
          git push
