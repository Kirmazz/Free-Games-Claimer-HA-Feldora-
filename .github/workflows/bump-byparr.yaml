name: Bump Byparr

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 06:00 UTC
  workflow_dispatch: {} # déclenchement manuel possible

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Byparr publie de vraies Releases → releases/latest fonctionne
      # (contrairement à feldorn, qui obligeait à lire l'API tags).
      - name: Dernière release Byparr
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/ThePhaseless/Byparr/releases/latest --jq .tag_name)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Version actuelle de l'add-on
        id: current
        run: |
          CUR=$(grep -oP '^version:\s*"?\K[^"]+' byparr/config.yaml)
          echo "version=$CUR" >> "$GITHUB_OUTPUT"

      - name: Bump si nouvelle version
        if: steps.upstream.outputs.version != steps.current.outputs.version
        env:
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i -E "s|^version:.*|version: \"${NEW}\"|" byparr/config.yaml
          sed -i -E "s|(ghcr\.io/thephaseless/byparr):.*|\1:${NEW}|" byparr/build.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add byparr/config.yaml byparr/build.yaml
          git commit -m "chore(byparr): bump to ${NEW}"
          git push
